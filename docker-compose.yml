# Local, mock-mode stack: brings up the full app (API + UI) with no GPU and
# no ML dependencies, using fake training/generation. Good for developing or
# demoing the product itself. Run: docker compose up --build
#
# For real training/generation, deploy backend/Dockerfile.gpu on a cloud GPU
# box instead -- see docs/TRAINING.md.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - imuse-data:/data
    environment:
      - IMUSE_MOCK_ML=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  imuse-data:
